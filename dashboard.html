<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <header class="header">
      <div class="title-wrap">
        <span class="logo-icon"></span>
        <h1 class="title">ONE PACE Analysis Dashboard</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn">⚙️</button>
        <button class="icon-btn">✖</button>
      </div>
    </header>

    <main class="content">
      <section class="alert-box">
        <div class="alert-header">
          <div class="alert-title-wrap">
            <span class="bulb-icon">📊</span>
            <span class="alert-title">전체 분석 리포트</span>
          </div>
        </div>
        <p class="link-text">실시간 커뮤니케이션 리스크 및 지표 대시보드입니다.</p>
      </section>

      <section class="card-section">
        <div class="badge badge-purple">
          <span>📈</span> 오해 탐지 현황
        </div>
        <ul class="info-list">
          <li>오늘 탐지된 오해 요소: 2건</li>
          <li>커뮤니케이션 명확도 점수: 88점</li>
        </ul>
      </section>
    </main>
  </div>
</body>
</html>
