<link rel="stylesheet" href="content.css">

<!-- ============================================================ 
     ONEPACE Content UI 
     ============================================================ --> 
 
<template id="onepace-composer-template"> 
  <div class="op-row"> 
 
    <button 
      type="button" 
      class="onepace-globe-button" 
      aria-label="상대방 국적 선택" 
      title="대화 상대 국적 선택" 
    > 
      🌐 
    </button> 
 
    <div class="onepace-country-status"> 
      <span class="onepace-status-country"></span> 
      <span> 팀원과 대화하는 중이에요. </span> 
      <span class="onepace-status-time"></span> 
    </div> 
 
    <div class="onepace-country-popup"> 
 
      <div class="onepace-country-title"> 
        국가 
      </div> 
 
      <div class="onepace-country-search-wrap"> 
        <span class="onepace-search-icon">⌕</span> 
 
        <input 
          class="onepace-country-search" 
          type="text" 
          placeholder="검색" 
          autocomplete="off" 
        /> 
      </div> 
 
      <!-- 나라 선택 리스트 --> 
      <div class="onepace-country-list"> 
        <!-- JS로 동적 생성 --> 
      </div> 
 
      <div class="onepace-country-footer"> 
        <button 
          type="button" 
          class="onepace-country-close" 
        > 
          닫기 
        </button> 
      </div> 
 
    </div> 
  </div> 
</template> 
 
 
<!-- ============================================================ 
     오해 경고창 
     ============================================================ --> 
 
<template id="onepace-warning-template"> 
 
  <div class="onepace-warning-backdrop"> 
 
    <div 
      class="onepace-warning" 
      role="dialog" 
      aria-modal="true" 
    > 
 
      <!-- ====================================================== 
           상단 헤더 
           ====================================================== --> 
 
      <div class="onepace-warning-head"> 
 
        <div class="onepace-warning-head-title"> 
 
 
          <!-- 선택한 국가의 영문명 + Business Culture --> 
          <strong class="onepace-warning-title-text"></strong> 
 
        </div> 
 
        <div class="onepace-warning-head-right"> 
 
          <!-- 선택한 국가의 현지 시간 --> 
          <span class="onepace-warning-country-time"></span> 
 
          <button 
            type="button" 
            class="onepace-warning-close-btn" 
            aria-label="닫기" 
          > 
            ✕ 
          </button> 
 
        </div> 
 
      </div> 
 
 
      <!-- ====================================================== 
           본문 영역 
           ====================================================== --> 
 
      <div class="onepace-warning-body"> 
 
        <!-- ---------------------------------------------------- 
             1. 실시간 탐지 
             ---------------------------------------------------- --> 
 
        <div class="onepace-warning-original"> 
 
          <span class="op-badge op-badge-orange"> 
            실시간 탐지 
          </span> 
 
          <div class="onepace-warning-original-text"></div> 
 
        </div> 
 
 
        <!-- ---------------------------------------------------- 
             2. 예상 뉘앙스 
             ---------------------------------------------------- --> 
 
        <div class="onepace-warning-copy"> 
 
          <span class="op-badge op-badge-purple"> 
            예상 뉘앙스 
          </span> 
 
          <!-- 
            현재 content.js에서 사용 중인 값. 
            화면에 표시하지 않고 분석 데이터 전달용으로 유지. 
          --> 
          <span 
            class="onepace-warning-country" 
            style="display: none;" 
          ></span> 
 
          <p class="onepace-warning-reason"></p> 
 
        </div> 
 
 
        <!-- ---------------------------------------------------- 
             3. 수정 제안 
             ---------------------------------------------------- --> 
 
        <div class="onepace-warning-suggestion"> 
 
          <span class="op-badge op-badge-mint"> 
            💡 수정 제안 
          </span> 
 
          <div class="onepace-warning-suggestion-text"></div> 
 
        </div> 
 
      </div> 
 
 
      <!-- ====================================================== 
           하단 버튼 영역 
           ====================================================== --> 
 
      <div class="onepace-warning-actions"> 
 
        <button 
          type="button" 
          class="onepace-use-suggestion" 
        > 
          Accept(수락) 
        </button> 
 
        <button 
          type="button" 
          class="onepace-send-anyway" 
        > 
          Dismiss(무시) 
        </button> 
 
      </div> 
 
    </div> 
 
  </div> 
 
</template> 
 
 
<!-- ============================================================ 
     수정 완료 토스트 알림 팝업 
     ============================================================ --> 
 
<template id="onepace-toast-template"> 
 
  <div class="onepace-toast-container" role="status" aria-live="polite"> 
 
    <span class="onepace-toast-text"> 
      "<span class="onepace-toast-suggestion-text"></span>"(으)로 수정했어요 
    </span> 
 
    <button type="button" class="onepace-toast-undo">실행 취소</button> 
 
  </div> 
 
</template>
