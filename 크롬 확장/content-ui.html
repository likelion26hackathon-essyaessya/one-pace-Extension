<!-- ============================================================
     ONEPACE Content UI
     ============================================================ -->


<template id="onepace-composer-template">

  <div class="op-row">

    <button
      type="button"
      class="onepace-globe-button"
      aria-label="상대방 국적 선택"
      title="대화 상대 국적 선택"
    >
      🌐
    </button>


    <div class="onepace-country-status">

      <span
        class="onepace-status-country"
      ></span>

      <span>
        팀원과 대화하는 중이에요.
      </span>

      <span
        class="onepace-status-time"
      ></span>

    </div>


    <div class="onepace-country-popup">

      <div class="onepace-country-title">
        국가
      </div>


      <div class="onepace-country-search-wrap">

        <span class="onepace-search-icon">
          ⌕
        </span>

        <input
          class="onepace-country-search"
          type="text"
          placeholder="검색"
          autocomplete="off"
        />

      </div>


      <div class="onepace-country-list"></div>


      <div class="onepace-country-footer">

        <button
          type="button"
          class="onepace-country-close"
        >
          닫기
        </button>

      </div>

    </div>

  </div>

</template>



<!-- ============================================================
     오해 경고창
     ============================================================ -->

<template id="onepace-warning-template">

  <div
    class="onepace-warning-backdrop"
  >

    <div
      class="onepace-warning"
      role="dialog"
      aria-modal="true"
    >

      <div class="onepace-warning-head">

        <span
          class="onepace-warning-mark"
        >
          ●
        </span>

        오해 가능성이 있어요

      </div>


      <div class="onepace-warning-body">

        <p
          class="onepace-warning-copy"
        >
          <span
            class="onepace-warning-country"
          ></span>
          에게 보낼 메시지를 ONE PACE가 확인했어요.
          <br>

          <span
            class="onepace-warning-reason"
          ></span>
        </p>


        <div
          class="onepace-warning-original"
        >

          <strong>
            현재 표현
          </strong>

          <br>

          <span
            class="onepace-warning-original-text"
          ></span>

        </div>


        <div
          class="onepace-warning-suggestion"
        >

          <strong>
            추천 표현
          </strong>

          <br>

          <span
            class="onepace-warning-suggestion-text"
          ></span>

        </div>

      </div>


      <div
        class="onepace-warning-actions"
      >

        <button
          type="button"
          class="onepace-send-anyway"
        >
          그대로 전송
        </button>


        <button
          type="button"
          class="onepace-use-suggestion"
        >
          수정해서 전송
        </button>

      </div>

    </div>

  </div>

</template>
